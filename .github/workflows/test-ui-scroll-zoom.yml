name: Build and test UI scroll zoom

on:
  push:
    branches:
      - improve-line-list-timeline-zoom
    paths:
      - ".github/workflows/test-ui-scroll-zoom.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build app
        run: python3 build.py
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test independent line scroll and timeline zoom
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/jizura-http.log 2>&1 &
          python3 - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width": 1440, "height": 900})
                  errors = []
                  page.on("pageerror", lambda e: errors.append(str(e)))
                  await page.goto("http://127.0.0.1:8765/")
                  await page.wait_for_selector("#timeline")
                  lyrics = "\n".join([f"テスト歌詞{i:02d}" for i in range(1, 41)])
                  await page.fill("#lyrics", lyrics)
                  await page.wait_for_timeout(900)

                  # Line list must be its own scroll container.
                  box = await page.locator("#lineList").bounding_box()
                  metrics = await page.locator("#lineList").evaluate("""el => ({
                    clientHeight: el.clientHeight,
                    scrollHeight: el.scrollHeight,
                    overflowY: getComputedStyle(el).overflowY,
                    overscrollBehaviorY: getComputedStyle(el).overscrollBehaviorY,
                    scrollTop: el.scrollTop
                  })""")
                  if metrics["scrollHeight"] <= metrics["clientHeight"]:
                      raise RuntimeError(f"line list did not overflow: {metrics}")
                  if metrics["overflowY"] not in ("auto", "scroll"):
                      raise RuntimeError(f"line list is not scrollable: {metrics}")

                  parent_before = await page.locator(".col-left").evaluate("el => el.scrollTop")
                  window_before = await page.evaluate("window.scrollY")
                  await page.mouse.move(box["x"] + box["width"]/2, box["y"] + min(box["height"]/2, 120))
                  await page.mouse.wheel(0, 650)
                  await page.wait_for_timeout(150)
                  line_after = await page.locator("#lineList").evaluate("el => el.scrollTop")
                  parent_after = await page.locator(".col-left").evaluate("el => el.scrollTop")
                  window_after = await page.evaluate("window.scrollY")
                  if line_after <= 0:
                      raise RuntimeError("wheel over line list did not scroll the line list")
                  if parent_after != parent_before or window_after != window_before:
                      raise RuntimeError(f"line-list wheel leaked to parent/page: parent {parent_before}->{parent_after}, window {window_before}->{window_after}")

                  # At the bottom, extra wheel input must still not chain to the parent/page.
                  await page.locator("#lineList").evaluate("el => el.scrollTop = el.scrollHeight")
                  parent_before2 = await page.locator(".col-left").evaluate("el => el.scrollTop")
                  window_before2 = await page.evaluate("window.scrollY")
                  await page.mouse.wheel(0, 650)
                  await page.wait_for_timeout(150)
                  parent_after2 = await page.locator(".col-left").evaluate("el => el.scrollTop")
                  window_after2 = await page.evaluate("window.scrollY")
                  if parent_after2 != parent_before2 or window_after2 != window_before2:
                      raise RuntimeError(f"overscroll chained out of line list: parent {parent_before2}->{parent_after2}, window {window_before2}->{window_after2}")

                  # Timeline wheel must zoom around the cursor without scrolling the page.
                  tl = await page.locator("#timeline").bounding_box()
                  await page.mouse.move(tl["x"] + tl["width"]/2, tl["y"] + tl["height"]/2)
                  window_tl_before = await page.evaluate("window.scrollY")
                  await page.mouse.wheel(0, -650)
                  await page.wait_for_timeout(150)
                  window_tl_after = await page.evaluate("window.scrollY")
                  if window_tl_after != window_tl_before:
                      raise RuntimeError(f"timeline wheel scrolled page: {window_tl_before}->{window_tl_after}")

                  # Zoom is cursor-centered: after zooming at 50%, the visible left edge is > 0.
                  # Clicking the far left should therefore seek to a positive time.
                  await page.mouse.click(tl["x"] + 2, tl["y"] + tl["height"]/2)
                  await page.wait_for_timeout(80)
                  time_text = await page.locator("#timeNow").inner_text()
                  parts = time_text.split(":")
                  t = float(parts[0]) * 60 + float(parts[1])
                  if t <= 0.05:
                      raise RuntimeError(f"timeline did not zoom around cursor; left edge seek was {time_text}")

                  if errors:
                      raise RuntimeError("page errors: " + " | ".join(errors))
                  print({
                      "ok": True,
                      "line_scroll_top": line_after,
                      "line_metrics": metrics,
                      "timeline_left_edge_after_zoom": time_text
                  })
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild web app"
          git push
