name: Test alpha MOV export

on:
  push:
    branches:
      - export-alpha-mov
    paths:
      - ".github/workflows/test-alpha-mov.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build app
        run: python3 build.py
      - name: Install tools
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Export test MOV in browser
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/jizura-http.log 2>&1 &
          python3 - <<'PY'
          import asyncio, base64
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width":1280,"height":800})
                  errors=[]
                  page.on("pageerror", lambda e: errors.append(str(e)))
                  await page.goto("http://127.0.0.1:8765/")
                  await page.wait_for_function("() => !!window.J && !!J.exportMOVAlpha && !!J.ui && !!J.ui.plan")
                  data = await page.evaluate(r"""
                  async () => {
                    const project = J.defaultProject();
                    project.lyrics = 'ALPHA';
                    project.title = '';
                    project.aspect = '1:1';
                    project.res = 720;
                    project.fps = 24;
                    project.includeAudio = true;
                    project.timing.offset = 0;
                    project.timing.snap = false;
                    const plan = J.plan(project, null);
                    plan.duration = 0.125;
                    plan.events = [];
                    plan.fx.hud = 'off';
                    plan.fx.chroma = 0;
                    for (const c of plan.cuts) {
                      c.enter='cut'; c.exit='cut'; c.hold='still'; c.inDur=0; c.outDur=0;
                      c.decor=[]; c.bg='none'; c.treat='none'; c.cam='push'; c.trans=null;
                    }

                    const sr=48000, n=Math.ceil(plan.duration*sr);
                    const buffer=new AudioBuffer({numberOfChannels:2,length:n,sampleRate:sr});
                    for(let ch=0;ch<2;ch++){
                      const d=buffer.getChannelData(ch);
                      for(let i=0;i<n;i++) d[i]=Math.sin(2*Math.PI*440*i/sr)*0.1;
                    }
                    const result=await J.exportMOVAlpha({
                      plan, project, audio:{buffer},
                      onProgress:()=>{}
                    });
                    const bytes=new Uint8Array(await result.blob.arrayBuffer());
                    let binary='';
                    const chunk=0x8000;
                    for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
                    return {
                      b64:btoa(binary),
                      size:bytes.length,
                      type:result.blob.type,
                      codec:result.codec,
                      audio:result.audio
                    };
                  }
                  """)
                  if errors:
                      raise RuntimeError("page errors: "+" | ".join(errors))
                  if data["type"] != "video/quicktime" or data["codec"] != "PNG + Alpha" or data["audio"] != "PCM":
                      raise RuntimeError(f"unexpected export metadata: {data}")
                  with open("/tmp/jizura-alpha.mov","wb") as f:
                      f.write(base64.b64decode(data["b64"]))
                  print({"size":data["size"],"type":data["type"],"codec":data["codec"],"audio":data["audio"]})
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Validate MOV container, alpha and audio
        shell: bash
        run: |
          ffprobe -v error -show_entries stream=index,codec_name,codec_type,pix_fmt,sample_rate,channels -of json /tmp/jizura-alpha.mov > /tmp/probe.json
          cat /tmp/probe.json
          python3 - <<'PY'
          import json, subprocess, os
          p=json.load(open("/tmp/probe.json"))
          streams=p["streams"]
          video=next((s for s in streams if s.get("codec_type")=="video"),None)
          audio=next((s for s in streams if s.get("codec_type")=="audio"),None)
          assert video, streams
          assert video.get("codec_name")=="png", video
          assert video.get("pix_fmt") in ("rgba","argb","bgra"), video
          assert audio, streams
          assert audio.get("codec_name")=="pcm_s16le", audio
          assert audio.get("sample_rate")=="48000", audio
          assert int(audio.get("channels",0))==2, audio

          subprocess.run([
              "ffmpeg","-v","error","-y","-i","/tmp/jizura-alpha.mov",
              "-frames:v","1","-f","rawvideo","-pix_fmt","rgba","/tmp/frame.rgba"
          ],check=True)
          raw=open("/tmp/frame.rgba","rb").read()
          assert raw and len(raw)%4==0
          alpha=raw[3::4]
          amin,amax=min(alpha),max(alpha)
          assert amin==0, (amin,amax)
          assert amax>0, (amin,amax)
          print({"video":video,"audio":audio,"alpha_min":amin,"alpha_max":amax,"raw_bytes":len(raw)})
          PY

      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild web app"
          git push
