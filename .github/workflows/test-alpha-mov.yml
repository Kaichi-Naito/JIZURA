name: Test alpha MOV export

on:
  push:
    branches:
      - export-alpha-mov
    paths:
      - "src/**"
      - "app/**"
      - "build.py"
      - ".github/workflows/test-alpha-mov.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build app
        run: python3 build.py
      - name: Install tools
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Export test MOV in browser
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/jizura-http.log 2>&1 &
          python3 - <<'PY'
          import asyncio, base64
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width":1280,"height":800})
                  errors=[]
                  page.on("pageerror", lambda e: errors.append(str(e)))
                  await page.goto("http://127.0.0.1:8765/")
                  await page.wait_for_function("() => !!window.J && !!J.exportMOVAlpha && !!J.ui && !!J.ui.plan")
                  # UI setting is saved in the project and mirrored between Easy/Detail controls.
                  await page.locator("#outAlphaBg").evaluate("(el)=>{el.value='50';el.dispatchEvent(new Event('input',{bubbles:true}));}")
                  ui_state = await page.evaluate("""() => ({
                    value:J.ui.project.alphaBgOpacity,
                    detail:document.querySelector('#outAlphaBg').value,
                    easy:document.querySelector('#eAlphaBg').value,
                    detailLabel:document.querySelector('#outAlphaBgValue').textContent,
                    easyLabel:document.querySelector('#eAlphaBgValue').textContent
                  })""")
                  if abs(float(ui_state["value"])-0.5)>1e-9 or ui_state["detail"]!="50" or ui_state["easy"]!="50":
                      raise RuntimeError(f"alpha background UI did not sync: {ui_state}")
                  payload_bg = await page.evaluate("async () => (await J.uiApi.projectPayloadForSave()).alphaBgOpacity")
                  if abs(float(payload_bg)-0.5)>1e-9:
                      raise RuntimeError(f"alpha background opacity not present in saved project payload: {payload_bg}")

                  data = await page.evaluate(r"""
                  async () => {
                    const project = J.defaultProject();
                    project.lyrics = 'ALPHA';
                    project.title = '';
                    project.aspect = '1:1';
                    project.res = 720;
                    project.fps = 24;
                    project.includeAudio = true;
                    project.timing.offset = 0;
                    project.timing.snap = false;
                    const plan = J.plan(project, null);
                    plan.duration = 0.125;
                    plan.events = [];
                    plan.fx.hud = 'off';
                    plan.fx.chroma = 0;
                    for (const c of plan.cuts) {
                      c.enter='cut'; c.exit='cut'; c.hold='still'; c.inDur=0; c.outDur=0;
                      c.decor=[]; c.bg='none'; c.treat='none'; c.cam='push'; c.trans=null;
                    }

                    const sr=48000, n=Math.ceil(plan.duration*sr);
                    const buffer=new AudioBuffer({numberOfChannels:2,length:n,sampleRate:sr});
                    for(let ch=0;ch<2;ch++){
                      const d=buffer.getChannelData(ch);
                      for(let i=0;i<n;i++) d[i]=Math.sin(2*Math.PI*440*i/sr)*0.1;
                    }
                    const encode = async opacity => {
                      project.alphaBgOpacity=opacity;
                      const result=await J.exportMOVAlpha({
                        plan, project, audio:{buffer},
                        onProgress:()=>{}
                      });
                      const bytes=new Uint8Array(await result.blob.arrayBuffer());
                      let binary='';
                      const chunk=0x8000;
                      for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
                      return {
                        b64:btoa(binary),
                        size:bytes.length,
                        type:result.blob.type,
                        codec:result.codec,
                        audio:result.audio,
                        backgroundOpacity:result.backgroundOpacity
                      };
                    };
                    return {zero:await encode(0), half:await encode(0.5)};
                  }
                  """)
                  if errors:
                      raise RuntimeError("page errors: "+" | ".join(errors))
                  for name, expected in (("zero",0),("half",0.5)):
                      item=data[name]
                      if item["type"] != "video/quicktime" or item["codec"] != "PNG + Alpha" or item["audio"] != "PCM":
                          raise RuntimeError(f"unexpected export metadata for {name}: {item}")
                      if abs(float(item["backgroundOpacity"])-expected)>1e-9:
                          raise RuntimeError(f"wrong background opacity metadata for {name}: {item}")
                      with open(f"/tmp/jizura-alpha-{name}.mov","wb") as fp:
                          fp.write(base64.b64decode(item["b64"]))
                  print({"ui":ui_state,"zeroSize":data["zero"]["size"],"halfSize":data["half"]["size"]})
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Validate MOV container, alpha and audio
        shell: bash
        run: |
          ffprobe -v error -show_entries stream=index,codec_name,codec_type,pix_fmt,sample_rate,channels -of json /tmp/jizura-alpha-zero.mov > /tmp/probe.json
          cat /tmp/probe.json
          python3 - <<'PY'
          import json, subprocess
          p=json.load(open("/tmp/probe.json"))
          streams=p["streams"]
          video=next((s for s in streams if s.get("codec_type")=="video"),None)
          audio=next((s for s in streams if s.get("codec_type")=="audio"),None)
          assert video, streams
          assert video.get("codec_name")=="png", video
          assert video.get("pix_fmt") in ("rgba","argb","bgra"), video
          assert audio, streams
          assert audio.get("codec_name")=="pcm_s16le", audio
          assert audio.get("sample_rate")=="48000", audio
          assert int(audio.get("channels",0))==2, audio

          def alpha_range(src, out):
              subprocess.run([
                  "ffmpeg","-v","error","-y","-i",src,
                  "-frames:v","1","-f","rawvideo","-pix_fmt","rgba",out
              ],check=True)
              raw=open(out,"rb").read()
              assert raw and len(raw)%4==0
              a=raw[3::4]
              return min(a),max(a)

          zmin,zmax=alpha_range("/tmp/jizura-alpha-zero.mov","/tmp/zero.rgba")
          hmin,hmax=alpha_range("/tmp/jizura-alpha-half.mov","/tmp/half.rgba")
          assert zmin==0 and zmax>0, (zmin,zmax)
          # 50% opaque background should cover every pixel at about half alpha,
          # while foreground text/effects can still reach full opacity.
          assert 126 <= hmin <= 129, (hmin,hmax)
          assert hmax==255, (hmin,hmax)
          print({"video":video,"audio":audio,"alpha_zero":[zmin,zmax],"alpha_half":[hmin,hmax]})
          PY

      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild web app"
          git push
