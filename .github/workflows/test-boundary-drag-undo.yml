name: Test timeline boundary drag and global undo

on:
  push:
    branches:
      - drag-timeline-cut-boundaries
    paths:
      - ".github/workflows/test-boundary-drag-undo.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build app
        run: python3 build.py
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run boundary drag and undo tests
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/jizura-http.log 2>&1 &
          python3 - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width": 1440, "height": 900})
                  errors=[]
                  page.on("pageerror", lambda e: errors.append(str(e)))
                  await page.goto("http://127.0.0.1:8765/")
                  await page.wait_for_selector("#timeline")

                  # Controlled timing with enough cuts and no interlude between lyric lines.
                  await page.fill("#lyrics", "AAA/BBB/CCC\nDDD/EEE/FFF\nGGG/HHH")
                  await page.wait_for_timeout(450)
                  await page.evaluate("""() => {
                    J.ui.project.timing.lineTimes = {0:1,1:3.5,2:6};
                    J.ui.project.fx.density = 1;
                    J.ui.project.timing.snap = false;
                    J.ui.project.timing.cutBoundaries = {};
                    J.uiApi.replan();
                    J.uiApi.resetEditorHistory();
                  }""")
                  await page.wait_for_timeout(550)

                  info = await page.evaluate("""() => {
                    const cuts=J.ui.plan.cuts.filter(c=>c.line>=0 && c.layout!=='interlude' && c.lineCut>=0).slice().sort((a,b)=>a.start-b.start);
                    let internal=null, cross=null;
                    for(let i=1;i<cuts.length;i++){
                      const l=cuts[i-1], r=cuts[i];
                      if(Math.abs(l.end-r.start)>.07) continue;
                      const k=J.cutBoundaryKey(l,r);
                      if(!internal && l.line===r.line) internal={li:l.index,ri:r.index,key:k,time:r.start,leftStart:l.start,rightEnd:r.end};
                      if(!cross && l.line!==r.line && r.lineCut===0) cross={li:l.index,ri:r.index,key:k,time:r.start,leftStart:l.start,rightEnd:r.end,rightLine:r.line};
                    }
                    return {duration:J.ui.plan.duration, internal, cross};
                  }""")
                  if not info["internal"] or not info["cross"]:
                      raise RuntimeError(f"expected internal and cross-line boundaries: {info}")

                  tl = await page.locator("#timeline").bounding_box()
                  if not tl:
                      raise RuntimeError("timeline has no box")

                  # Drag one internal boundary to the right.
                  old_t = info["internal"]["time"]
                  target_t = min(info["internal"]["rightEnd"] - 0.3, old_t + 0.35)
                  x0 = tl["x"] + old_t / info["duration"] * tl["width"]
                  x1 = tl["x"] + target_t / info["duration"] * tl["width"]
                  y = tl["y"] + tl["height"] * 0.55
                  await page.mouse.move(x0, y)
                  cursor = await page.locator("#timeline").evaluate("el => el.style.cursor")
                  if cursor != "col-resize":
                      raise RuntimeError(f"boundary hover cursor missing: {cursor}")
                  await page.mouse.down()
                  await page.mouse.move(x1, y, steps=8)
                  await page.mouse.up()
                  await page.wait_for_timeout(120)

                  internal_after = await page.evaluate("""key => {
                    const v=J.ui.project.timing.cutBoundaries[key];
                    const cuts=J.ui.plan.cuts;
                    const pair=[];
                    for(let i=1;i<cuts.length;i++){
                      const l=cuts[i-1], r=cuts[i];
                      if(J.cutBoundaryKey(l,r)===key) return {saved:v,leftEnd:l.end,rightStart:r.start,leftDur:l.dur,rightDur:r.dur};
                    }
                    return {saved:v};
                  }""", info["internal"]["key"])
                  if internal_after["saved"] is None:
                      raise RuntimeError(f"internal boundary was not persisted: {internal_after}")
                  if abs(internal_after["leftEnd"] - internal_after["rightStart"]) > 1e-6:
                      raise RuntimeError(f"internal boundary opened a gap: {internal_after}")
                  if abs(internal_after["rightStart"] - old_t) < 0.08:
                      raise RuntimeError(f"internal boundary barely moved: {internal_after}")

                  moved_t = internal_after["rightStart"]

                  # Ctrl+Z must undo the whole editor operation even while textarea is focused.
                  await page.locator("#lyrics").focus()
                  lyrics_before_undo = await page.locator("#lyrics").input_value()
                  await page.keyboard.press("Control+Z")
                  await page.wait_for_timeout(300)
                  undo_state = await page.evaluate("""key => ({
                    lyrics:document.querySelector('#lyrics').value,
                    boundary:J.ui.project.timing.cutBoundaries && J.ui.project.timing.cutBoundaries[key]
                  })""", info["internal"]["key"])
                  if undo_state["lyrics"] != lyrics_before_undo:
                      raise RuntimeError(f"Ctrl+Z used native textarea undo instead of editor undo: {undo_state}")
                  if undo_state["boundary"] is not None:
                      raise RuntimeError(f"Ctrl+Z did not undo boundary edit: {undo_state}")

                  # Ctrl+Y restores it.
                  await page.keyboard.press("Control+Y")
                  await page.wait_for_timeout(300)
                  redo_state = await page.evaluate("""key => ({
                    lyrics:document.querySelector('#lyrics').value,
                    boundary:J.ui.project.timing.cutBoundaries && J.ui.project.timing.cutBoundaries[key]
                  })""", info["internal"]["key"])
                  if redo_state["lyrics"] != lyrics_before_undo or redo_state["boundary"] is None:
                      raise RuntimeError(f"Ctrl+Y did not redo boundary edit: {redo_state}")
                  if abs(float(redo_state["boundary"]) - moved_t) > 0.03:
                      raise RuntimeError(f"redo boundary time changed: {redo_state}, wanted={moved_t}")

                  # Now drag a boundary between lyric lines; right line's editable start time must follow.
                  cross = await page.evaluate("""() => {
                    const cuts=J.ui.plan.cuts.filter(c=>c.line>=0 && c.layout!=='interlude' && c.lineCut>=0).slice().sort((a,b)=>a.start-b.start);
                    for(let i=1;i<cuts.length;i++){
                      const l=cuts[i-1], r=cuts[i];
                      if(l.line!==r.line && r.lineCut===0 && Math.abs(l.end-r.start)<.07)
                        return {key:J.cutBoundaryKey(l,r),time:r.start,rightEnd:r.end,rightLine:r.line};
                    }
                    return null;
                  }""")
                  if not cross:
                      raise RuntimeError("cross-line boundary disappeared")

                  old_cross = cross["time"]
                  target_cross = min(cross["rightEnd"] - 0.28, old_cross + 0.22)
                  # Timeline duration may be unchanged but read it again for exact mapping.
                  dur = await page.evaluate("J.ui.plan.duration")
                  x0 = tl["x"] + old_cross / dur * tl["width"]
                  x1 = tl["x"] + target_cross / dur * tl["width"]
                  await page.mouse.move(x0, y)
                  await page.mouse.down()
                  await page.mouse.move(x1, y, steps=6)
                  await page.mouse.up()
                  await page.wait_for_timeout(150)

                  cross_after = await page.evaluate("""x => ({
                    boundary:J.ui.project.timing.cutBoundaries[x.key],
                    lineTime:J.ui.project.timing.lineTimes[x.rightLine],
                    lineStart:J.ui.plan.lines[x.rightLine].start
                  })""", cross)
                  if cross_after["boundary"] is None or cross_after["lineTime"] is None:
                      raise RuntimeError(f"cross-line boundary was not persisted to line start: {cross_after}")
                  if abs(float(cross_after["boundary"]) - float(cross_after["lineTime"])) > 1e-6 or abs(float(cross_after["lineStart"]) - float(cross_after["lineTime"])) > 1e-6:
                      raise RuntimeError(f"cross-line boundary/line time disagree: {cross_after}")

                  # Let autosave settle, reload, and verify both boundary kinds survive.
                  await page.wait_for_timeout(900)
                  saved_internal = float(redo_state["boundary"])
                  saved_cross = float(cross_after["boundary"])
                  await page.reload()
                  await page.wait_for_selector("#timeline")
                  await page.wait_for_function("() => !!J.ui && !!J.ui.plan && J.ui.plan.cuts.length > 0")
                  reload_state = await page.evaluate("""keys => ({
                    internal:J.ui.project.timing.cutBoundaries[keys[0]],
                    cross:J.ui.project.timing.cutBoundaries[keys[1]]
                  })""", [info["internal"]["key"], cross["key"]])
                  if reload_state["internal"] is None or abs(float(reload_state["internal"]) - saved_internal) > .03:
                      raise RuntimeError(f"internal boundary did not survive reload: {reload_state}")
                  if reload_state["cross"] is None or abs(float(reload_state["cross"]) - saved_cross) > .03:
                      raise RuntimeError(f"cross boundary did not survive reload: {reload_state}")

                  if errors:
                      raise RuntimeError("page errors: " + " | ".join(errors))
                  print({
                    "ok":True,
                    "internal":{"before":old_t,"after":moved_t,"key":info["internal"]["key"]},
                    "undo":undo_state,
                    "redo":redo_state,
                    "cross":cross_after,
                    "reload":reload_state
                  })
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild web app"
          git push
