name: Test line-list workflow improvements

on:
  push:
    branches:
      - follow-current-line-in-list
    paths:
      - "src/**"
      - "app/**"
      - "build.py"
      - ".github/workflows/test-line-follow.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build app
        run: python3 build.py
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test line list follow, inline lyric editing, and saved editor height
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/jizura-http.log 2>&1 &
          python3 - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width":1440,"height":900})
                  errors=[]
                  page.on("pageerror", lambda e: errors.append(str(e)))
                  await page.goto("http://127.0.0.1:8765/")
                  await page.wait_for_selector("#lineList")

                  # 1) Current playback line follows inside the independent line-list scroller.
                  lyrics="\n".join([f"LINE {i:02d}" for i in range(1,31)])
                  await page.fill("#lyrics", lyrics)
                  await page.wait_for_timeout(500)
                  await page.evaluate("""() => {
                    const t={};
                    for(let i=0;i<30;i++) t[i]=i*2;
                    J.ui.project.timing.lineTimes=t;
                    J.ui.project.timing.snap=false;
                    J.uiApi.replan();
                  }""")
                  await page.wait_for_timeout(250)

                  metrics=await page.locator("#lineList").evaluate("""el=>({
                    clientHeight:el.clientHeight,scrollHeight:el.scrollHeight,scrollTop:el.scrollTop
                  })""")
                  if metrics["scrollHeight"] <= metrics["clientHeight"]:
                      raise RuntimeError(f"line list did not overflow: {metrics}")

                  await page.locator("#lineList").evaluate("el=>el.scrollTop=0")
                  win_before=await page.evaluate("window.scrollY")
                  await page.evaluate("J.uiApi.seek(48.01)")
                  await page.wait_for_timeout(150)
                  state=await page.evaluate("""() => {
                    const list=document.querySelector('#lineList');
                    const el=J.ui.lineEls[24];
                    const lr=list.getBoundingClientRect(), er=el.getBoundingClientRect();
                    return {
                      scrollTop:list.scrollTop,
                      visible:er.top>=lr.top-1 && er.bottom<=lr.bottom+1,
                      current:el.classList.contains('cur'),
                      windowY:window.scrollY
                    };
                  }""")
                  if state["scrollTop"] <= 0 or not state["visible"] or not state["current"]:
                      raise RuntimeError(f"normal-order follow failed: {state}")
                  if state["windowY"] != win_before:
                      raise RuntimeError(f"line follow scrolled the page: {win_before}->{state['windowY']}")

                  # Time-sorted mode must also follow the correct original line index.
                  # Keep timings realistic; swap only two adjacent rows so display order genuinely differs.
                  await page.evaluate("""() => {
                    const t={};
                    for(let i=0;i<30;i++) t[i]=i*2;
                    t[23]=48; t[24]=46;
                    J.ui.project.timing.lineTimes=t;
                    J.ui.project.ui.lineSortByTime=true;
                    J.uiApi.replan();
                  }""")
                  await page.wait_for_timeout(200)
                  await page.locator("#lineList").evaluate("el=>el.scrollTop=0")
                  await page.evaluate("J.uiApi.seek(46.01)")
                  await page.wait_for_timeout(150)
                  sorted_state=await page.evaluate("""() => {
                    const list=document.querySelector('#lineList');
                    const el=J.ui.lineEls[24];
                    const lr=list.getBoundingClientRect(), er=el.getBoundingClientRect();
                    return {
                      scrollTop:list.scrollTop,
                      visible:er.top>=lr.top-1 && er.bottom<=lr.bottom+1,
                      current:el.classList.contains('cur'),
                      pressed:document.querySelector('#btnSortLines').getAttribute('aria-pressed')
                    };
                  }""")
                  if sorted_state["scrollTop"] <= 0 or not sorted_state["visible"] or not sorted_state["current"] or sorted_state["pressed"]!="true":
                      raise RuntimeError(f"time-sorted follow failed: {sorted_state}")

                  # 2) Inline lyric editing preserves source syntax and edits the correct source line.
                  await page.evaluate("""() => {
                    J.ui.project.lyrics='FIRST\n[00:05.00]夜明け/覚えてる|NOTE\nTHIRD';
                    J.ui.project.timing.lineTimes={0:9,1:1,2:5};
                    J.ui.project.ui.lineSortByTime=true;
                    J.uiApi.replan();
                  }""")
                  await page.wait_for_timeout(220)
                  # Find the row for original parsed line index 1, regardless of visual sort order.
                  edit=page.locator("#lineList .ln").filter(has=page.locator('input.txt-edit[value="夜明け/覚えてる|NOTE"]')).locator(".txt-edit")
                  if await edit.count()!=1:
                      raise RuntimeError("inline lyric editor did not expose the source syntax")
                  await edit.fill("夜明け/変えた|NOTE")
                  await edit.press("Enter")
                  await page.wait_for_timeout(260)
                  lyric_state=await page.evaluate("""() => ({
                    raw:J.ui.project.lyrics,
                    textarea:document.querySelector('#lyrics').value,
                    parsed:J.parseLyrics(J.ui.project.lyrics).lines.map(x=>x.text)
                  })""")
                  expected_raw="FIRST\n[00:05.00]夜明け/変えた|NOTE\nTHIRD"
                  if lyric_state["raw"]!=expected_raw or lyric_state["textarea"]!=expected_raw:
                      raise RuntimeError(f"inline edit did not update source/main textarea correctly: {lyric_state}")
                  if "夜明け変えた" not in lyric_state["parsed"]:
                      raise RuntimeError(f"inline edit did not replan the edited lyric: {lyric_state}")

                  # 3) User-resized lyric textarea height is stored in project UI and restored after reload.
                  await page.evaluate("""() => {
                    const el=document.querySelector('#lyrics');
                    el.style.height='336px';
                  }""")
                  await page.wait_for_timeout(650)
                  height_state=await page.evaluate("""() => ({
                    saved:J.ui.project.ui && J.ui.project.ui.lyricsHeight,
                    actual:Math.round(document.querySelector('#lyrics').getBoundingClientRect().height)
                  })""")
                  if height_state["saved"] is None or abs(float(height_state["saved"])-336)>3:
                      raise RuntimeError(f"lyrics height was not saved: {height_state}")
                  payload_height=await page.evaluate("async () => (await J.uiApi.projectPayloadForSave()).ui.lyricsHeight")
                  if abs(float(payload_height)-float(height_state["saved"]))>2:
                      raise RuntimeError(f"saved project payload lost lyric height: payload={payload_height}, state={height_state}")

                  await page.evaluate("J.uiApi.flushSave()")
                  await page.reload()
                  await page.wait_for_selector("#lyrics")
                  await page.wait_for_function("() => !!J.ui && !!J.ui.plan")
                  reload_height=await page.evaluate("""() => ({
                    saved:J.ui.project.ui && J.ui.project.ui.lyricsHeight,
                    actual:Math.round(document.querySelector('#lyrics').getBoundingClientRect().height),
                    raw:J.ui.project.lyrics
                  })""")
                  if reload_height["saved"] is None or abs(float(reload_height["actual"])-float(reload_height["saved"]))>3:
                      raise RuntimeError(f"lyrics height did not restore after reload: {reload_height}")
                  if reload_height["raw"]!=expected_raw:
                      raise RuntimeError(f"inline-edited lyric did not survive reload: {reload_height}")

                  if errors:
                      raise RuntimeError("page errors: "+" | ".join(errors))
                  print({"ok":True,"follow":state,"sortedFollow":sorted_state,"inlineEdit":lyric_state,"height":height_state,"reloadHeight":reload_height})
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild web app"
          git push
