name: Test timeline focus integration

on:
  push:
    branches:
      - ensure-timeline-line-focus
    paths:
      - "src/**"
      - "app/**"
      - "build.py"
      - ".github/workflows/test-timeline-focus.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 build.py
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify timeline focus and existing requested features
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          python3 - <<'PY'
          import asyncio, struct, zlib, binascii
          from playwright.async_api import async_playwright

          def chunk(t,d):
              return struct.pack(">I",len(d))+t+d+struct.pack(">I",binascii.crc32(t+d)&0xffffffff)
          raw=b"\x00\xff\x00\x00\xff"
          png=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",1,1,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b"")
          open("/tmp/red.png","wb").write(png)

          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              page=await b.new_page(viewport={"width":1600,"height":950})
              errors=[]
              page.on("pageerror",lambda e: errors.append(str(e)))
              await page.goto("http://127.0.0.1:8765/")
              await page.wait_for_function("() => !!J.ui && !!J.ui.plan")

              # Splitters still work and save values.
              l0=await page.locator(".col-left").bounding_box()
              sh=await page.locator("#leftSplitter").bounding_box()
              await page.mouse.move(sh["x"]+3,sh["y"]+100); await page.mouse.down()
              await page.mouse.move(sh["x"]+73,sh["y"]+100,steps=5); await page.mouse.up()
              await page.wait_for_timeout(80)
              l1=await page.locator(".col-left").bounding_box()
              assert l1["width"]>l0["width"]+45,(l0,l1)

              d0=await page.locator("#timelineDock").bounding_box()
              hh=await page.locator("#stageSplitter").bounding_box()
              await page.mouse.move(hh["x"]+100,hh["y"]+3); await page.mouse.down()
              await page.mouse.move(hh["x"]+100,hh["y"]-57,steps=5); await page.mouse.up()
              await page.wait_for_timeout(80)
              d1=await page.locator("#timelineDock").bounding_box()
              assert d1["height"]>d0["height"]+40,(d0,d1)

              # Image item is inserted, planned, rendered and saved.
              await page.locator("#imageFile").set_input_files("/tmp/red.png")
              await page.wait_for_timeout(400)
              state=await page.evaluate("""() => {
                const ln=J.ui.plan.lines.find(x=>x.kind==='image');
                const cut=ln&&J.ui.plan.cuts.find(c=>c.line===ln.index&&c.layout==='image');
                return {token:J.ui.project.lyrics.includes('[img:'),line:ln&&ln.index,cut:!!cut,cached:!!(ln&&J.getImageAsset(ln.imageId))};
              }""")
              assert state["token"] and state["line"] is not None and state["cut"] and state["cached"],state
              payload=await page.evaluate("J.uiApi.projectPayloadForSave()")
              assert payload.get("_imageAssets") and payload["_imageAssets"][0]["dataUrl"].startswith("data:image/"),payload.keys()

              # Populate many rows and focus the first item by clicking a timeline cut.
              await page.evaluate("""() => {
                const img=J.ui.project.lyrics.split(String.fromCharCode(10)).find(x=>x.startsWith('[img:'));
                J.ui.project.lyrics=[img,...Array.from({length:30},(_,i)=>'TXT '+i)].join(String.fromCharCode(10));
                J.ui.project.timing.lineTimes=Object.fromEntries(Array.from({length:31},(_,i)=>[i,i*2]));
                J.uiApi.replan();
                J.ui.timelineZoom=8; J.ui.timelineStart=0; J.ui.need=true;
              }""")
              await page.wait_for_timeout(180)
              await page.locator("#lineList").evaluate("el=>el.scrollTop=el.scrollHeight")
              before=await page.locator("#lineList").evaluate("el=>el.scrollTop")
              direct=await page.evaluate("""() => {
                const l=document.querySelector('#lineList');
                const e=J.ui.lineEls[0];
                const lr=l.getBoundingClientRect(),er=e.getBoundingClientRect();
                const b=l.scrollTop;
                J.uiApi.revealLineInList(0);
                return {before:b,after:l.scrollTop,lrTop:lr.top,lrBottom:lr.bottom,erTop:er.top,erBottom:er.bottom,offsetTop:e.offsetTop,clientHeight:l.clientHeight,scrollHeight:l.scrollHeight};
              }""")
              print({"directReveal":direct})
              assert direct["after"] < direct["before"] - 20, direct
              await page.locator("#lineList").evaluate("el=>el.scrollTop=el.scrollHeight")
              before=await page.locator("#lineList").evaluate("el=>el.scrollTop")
              hit=await page.evaluate("""() => {
                const h=J.ui.timelineCutHits.find(h=>{const c=J.ui.plan.cuts[h.cutIndex];return c&&c.line===0;});
                return h&&{x:h.x,y:h.y,w:h.w,h:h.h};
              }""")
              assert hit,hit
              tl=await page.locator("#timeline").bounding_box()
              cs=await page.locator("#timeline").evaluate("el=>({w:el.width,h:el.height})")
              # Click left-of-center to avoid action buttons, but well away from boundaries.
              x=tl["x"]+(hit["x"]+hit["w"]*.35)/cs["w"]*tl["width"]
              y=tl["y"]+(hit["y"]+hit["h"]*.42)/cs["h"]*tl["height"]
              await page.mouse.click(x,y)
              await page.wait_for_timeout(120)
              nav=await page.evaluate("""() => {
                const l=document.querySelector('#lineList'),e=J.ui.lineEls[0],lr=l.getBoundingClientRect(),er=e.getBoundingClientRect();
                return {scroll:l.scrollTop,visible:er.top>=lr.top-1&&er.bottom<=lr.bottom+1};
              }""")
              assert nav["visible"] and nav["scroll"]<before,(before,nav,hit)

              # Pressing an action icon on the same timeline item also focuses its row.
              await page.locator("#lineList").evaluate("el=>el.scrollTop=el.scrollHeight")
              await page.evaluate("J.ui.need=true")
              await page.wait_for_timeout(100)
              act=await page.evaluate("""() => {
                const h=J.ui.timelineActionHits.find(h=>h.line===0&&h.action==='lock');
                return h&&{x:h.x,y:h.y,w:h.w,h:h.h};
              }""")
              if act:
                x=tl["x"]+(act["x"]+act["w"]/2)/cs["w"]*tl["width"]
                y=tl["y"]+(act["y"]+act["h"]/2)/cs["h"]*tl["height"]
                await page.mouse.click(x,y); await page.wait_for_timeout(120)
                nav2=await page.evaluate("""() => {const l=document.querySelector('#lineList'),e=J.ui.lineEls[0],lr=l.getBoundingClientRect(),er=e.getBoundingClientRect();return {scroll:l.scrollTop,visible:er.top>=lr.top-1&&er.bottom<=lr.bottom+1};}""")
                assert nav2["visible"],nav2
              else:
                nav2=None

              if errors: raise RuntimeError("page errors: "+" | ".join(errors))
              print({"ok":True,"left":[l0["width"],l1["width"]],"dock":[d0["height"],d1["height"]],"image":state,"nav":nav,"navAction":nav2})
              await b.close()
          asyncio.run(main())
          PY
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild web app"
          git push
