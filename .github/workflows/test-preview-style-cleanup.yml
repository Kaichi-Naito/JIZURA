name: Test preview sizing style hover and image removal

on:
  push:
    branches:
      - restore-preview-remove-images-style-hover
    paths:
      - ".github/workflows/test-preview-style-cleanup.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build app
        run: python3 build.py
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run browser regression tests
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/jizura-http.log 2>&1 &
          python3 - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={"width":1600,"height":950})
                  errors=[]
                  page.on("pageerror",lambda e: errors.append(str(e)))
                  await page.goto("http://127.0.0.1:8765/")
                  await page.wait_for_function("() => !!J.ui && !!J.ui.plan")
                  await page.wait_for_selector("#viewport")

                  # 1) Default preview uses the pre-splitter geometry, not the full remaining column height.
                  await page.evaluate("""() => {
                    J.ui.project.aspect='9:16';
                    J.ui.project.ui.previewHeight=null;
                    J.uiApi.syncUI();
                    J.uiApi.replan();
                  }""")
                  await page.wait_for_timeout(160)
                  default_size=await page.evaluate("""() => {
                    const vp=document.querySelector('#viewport').getBoundingClientRect();
                    const cv=document.querySelector('#view').getBoundingClientRect();
                    return {
                      viewportH:vp.height, canvasH:cv.height, windowH:innerHeight,
                      custom:document.querySelector('#viewport').classList.contains('user-sized'),
                      saved:J.ui.project.ui.previewHeight
                    };
                  }""")
                  if default_size["custom"] or default_size["saved"] is not None:
                      raise RuntimeError(f"default preview unexpectedly custom-sized: {default_size}")
                  if default_size["canvasH"] > default_size["windowH"]*.68 + 5 or default_size["viewportH"] > default_size["windowH"]*.68 + 8:
                      raise RuntimeError(f"default preview is taller than old 68vh behavior: {default_size}")

                  # Old PR13 project state must migrate back to default instead of stretching preview.
                  legacy=await page.evaluate("""async () => {
                    const p=J.defaultProject();
                    p.aspect='9:16';
                    p.ui={leftWidth:410,timelineDockHeight:96,lineSortByTime:false,lyricsHeight:null};
                    await J.uiApi.applyProjectData(p);
                    const vp=document.querySelector('#viewport').getBoundingClientRect();
                    return {
                      previewHeight:J.ui.project.ui.previewHeight,
                      hasDock:Object.prototype.hasOwnProperty.call(J.ui.project.ui,'timelineDockHeight'),
                      custom:document.querySelector('#viewport').classList.contains('user-sized'),
                      h:vp.height,
                      windowH:innerHeight
                    };
                  }""")
                  if legacy["previewHeight"] is not None or legacy["hasDock"] or legacy["custom"] or legacy["h"] > legacy["windowH"]*.68+8:
                      raise RuntimeError(f"legacy workspace size did not migrate to old default: {legacy}")

                  # Dragging horizontal splitter explicitly creates and persists a custom preview height.
                  await page.evaluate("""() => {
                    J.ui.project.aspect='16:9';
                    J.ui.project.ui.previewHeight=null;
                    J.uiApi.syncUI(); J.uiApi.replan();
                  }""")
                  await page.wait_for_timeout(100)
                  vp0=await page.locator("#viewport").bounding_box()
                  await page.locator("#stageSplitter").scroll_into_view_if_needed()
                  sh=await page.locator("#stageSplitter").bounding_box()
                  await page.mouse.move(sh["x"]+100,sh["y"]+sh["height"]/2)
                  await page.mouse.down()
                  await page.mouse.move(sh["x"]+100,sh["y"]+sh["height"]/2+70,steps=6)
                  await page.mouse.up()
                  await page.wait_for_timeout(120)
                  custom_size=await page.evaluate("""() => ({
                    h:document.querySelector('#viewport').getBoundingClientRect().height,
                    saved:J.ui.project.ui.previewHeight,
                    custom:document.querySelector('#viewport').classList.contains('user-sized')
                  })""")
                  if not custom_size["custom"] or custom_size["saved"] is None or custom_size["h"] < vp0["height"]+45:
                      raise RuntimeError(f"custom preview resize failed: before={vp0}, after={custom_size}")
                  payload=await page.evaluate("J.uiApi.projectPayloadForSave()")
                  if abs(float(payload["ui"]["previewHeight"])-float(custom_size["saved"]))>2:
                      raise RuntimeError(f"project save lost preview height: {payload['ui']}")

                  # 2) Time fields remain readable; widening left panel does not leave tiny 52px controls.
                  await page.evaluate("""() => {
                    J.ui.project.ui.leftWidth=500;
                    J.uiApi.applyWorkspaceUi();
                    J.ui.project.lyrics='FIRST LINE\nSECOND LINE';
                    J.ui.project.timing.lineTimes={0:123.45,1:156.78};
                    J.ui.project.timing.lineEnds={0:150.67,1:180.89};
                    J.uiApi.replan();
                  }""")
                  await page.wait_for_timeout(100)
                  time_dims=await page.evaluate("""() => {
                    const s=document.querySelector('#lineList .start-time');
                    const e=document.querySelector('#lineList .end-time');
                    return {
                      sw:s.getBoundingClientRect().width, ew:e.getBoundingClientRect().width,
                      sf:getComputedStyle(s).fontSize, ef:getComputedStyle(e).fontSize,
                      sv:s.value, ev:e.value
                    };
                  }""")
                  if time_dims["sw"] < 66 or time_dims["ew"] < 66 or time_dims["sf"]!="11px" or time_dims["ef"]!="11px":
                      raise RuntimeError(f"timecode fields are still too narrow: {time_dims}")

                  # 3) Image feature is gone. Legacy image tokens are ignored safely.
                  image_removed=await page.evaluate("""async () => {
                    const parsed=J.parseLyrics('A\n[img:legacy123]\nB').lines.map(x=>x.text);
                    const p=J.defaultProject();
                    p.images={legacy123:{name:'old.png'}};
                    p._imageAssets=[{id:'legacy123',dataUrl:'data:image/png;base64,AA=='}];
                    await J.uiApi.applyProjectData(p);
                    const out=await J.uiApi.projectPayloadForSave();
                    return {
                      imageInput:!!document.querySelector('#imageFile'),
                      imageLayout:!!J.LAYOUTS.image,
                      parsed,
                      hasImages:Object.prototype.hasOwnProperty.call(J.ui.project,'images'),
                      hasSavedImages:Object.prototype.hasOwnProperty.call(out,'images'),
                      hasEmbedded:Object.prototype.hasOwnProperty.call(out,'_imageAssets')
                    };
                  }""")
                  if image_removed["imageInput"] or image_removed["imageLayout"] or image_removed["parsed"]!=["A","B"] or image_removed["hasImages"] or image_removed["hasSavedImages"] or image_removed["hasEmbedded"]:
                      raise RuntimeError(f"image feature was not fully retired: {image_removed}")

                  # 4) Per-line styles keep project colours but use selected-style behavior.
                  style_state=await page.evaluate("""() => {
                    J.ui.project=Object.assign(J.defaultProject(),{
                      lyrics:'スタイルの違いをしっかり確認するための長めのテキストです',
                      style:'blueprint', seed:20260922
                    });
                    J.ui.project.colors={enabled:false};
                    J.ui.project.overrides={};
                    J.uiApi.syncUI(); J.uiApi.replan();

                    const signature = () => J.ui.plan.cuts.filter(c=>c.line===0&&c.layout!=='interlude').map(c=>({
                      layout:c.layout,enter:c.enter,exit:c.exit,hold:c.hold,bg:c.bg,cam:c.cam,treat:c.treat,
                      decor:(c.decor||[]).map(d=>d.id)
                    }));
                    const baseSig=signature();
                    const baseSeed=J.ui.plan.lines[0].seed;

                    J.ui.project.overrides={0:{style:'sakura'}};
                    J.uiApi.replan();
                    const sakura=J.ui.plan.styles.sakura;
                    const global=J.resolveStyle(J.ui.project);
                    const sakuraSig=signature();
                    const localDef=J.STYLES.sakura;
                    const colours=['bg','fg','sub','accent','accent2','ink','dim','ghostA','ghostB'];
                    const colourMatch=sakura.schemes.every((s,i)=>colours.every(k=>{
                      const p=global.schemes[i%global.schemes.length]||global.schemes[0];
                      return p[k]==null || s[k]===p[k];
                    }));
                    return {
                      baseSeed, lineSeed:J.ui.plan.lines[0].seed,
                      baseSig,sakuraSig,colourMatch,
                      texture:JSON.stringify(sakura.texture),
                      expectedTexture:JSON.stringify(localDef.texture),
                      hud:sakura.hud,expectedHud:localDef.hud,
                      layoutBias:JSON.stringify(sakura.bias&&sakura.bias.layout),
                      expectedLayoutBias:JSON.stringify(localDef.bias&&localDef.bias.layout),
                      styleKey:J.ui.plan.lines[0].styleKey
                    };
                  }""")
                  if style_state["styleKey"]!="sakura" or not style_state["colourMatch"]:
                      raise RuntimeError(f"per-line style/palette resolution failed: {style_state}")
                  if style_state["texture"]!=style_state["expectedTexture"] or style_state["hud"]!=style_state["expectedHud"] or style_state["layoutBias"]!=style_state["expectedLayoutBias"]:
                      raise RuntimeError(f"per-line style is still only partially applied: {style_state}")
                  if style_state["lineSeed"]==style_state["baseSeed"] or style_state["sakuraSig"]==style_state["baseSig"]:
                      raise RuntimeError(f"per-line style did not materially recompose the line: {style_state}")

                  # 5) Hovering style menu previews without committing; click commits.
                  await page.evaluate("""() => {
                    J.ui.project.overrides={};
                    J.uiApi.replan();
                  }""")
                  await page.wait_for_timeout(100)
                  trigger=page.locator("#lineList .ln").nth(0).locator(".style-trigger")
                  await trigger.click()
                  await page.wait_for_selector(".style-menu")
                  ocean=page.locator(".style-menu button[data-k='ocean']")
                  if await ocean.count()!=1:
                      raise RuntimeError("深海 style option not found")
                  before_override=await page.evaluate("() => (J.ui.project.overrides[0]||{}).style || null")
                  await ocean.hover()
                  await page.wait_for_timeout(180)
                  hover=await page.evaluate("""() => {
                    const pv=J.ui.layoutPreview;
                    return {
                      committed:(J.ui.project.overrides[0]||{}).style||null,
                      hasPreview:!!pv,
                      styleKey:pv&&pv.plan.lines[0]&&pv.plan.lines[0].styleKey,
                      previewTexture:pv&&pv.plan.styles.ocean&&JSON.stringify(pv.plan.styles.ocean.texture),
                      expected:JSON.stringify(J.STYLES.ocean.texture)
                    };
                  }""")
                  if before_override is not None or hover["committed"] is not None or not hover["hasPreview"] or hover["styleKey"]!="ocean" or hover["previewTexture"]!=hover["expected"]:
                      raise RuntimeError(f"style hover preview failed/committed too early: {hover}")
                  await ocean.click()
                  await page.wait_for_timeout(220)
                  committed=await page.evaluate("""() => ({
                    style:(J.ui.project.overrides[0]||{}).style||null,
                    preview:J.ui.layoutPreview,
                    lineStyle:J.ui.plan.lines[0].styleKey
                  })""")
                  if committed["style"]!="ocean" or committed["preview"] is not None or committed["lineStyle"]!="ocean":
                      raise RuntimeError(f"style click did not commit correctly: {committed}")

                  # 6) Persist custom preview height, reload, and verify it comes back.
                  # Restore one explicit height because applyProjectData above intentionally reset UI.
                  await page.evaluate("""() => {
                    J.ui.project.ui.previewHeight=360;
                    J.uiApi.applyWorkspaceUi(); J.uiApi.flushSave();
                  }""")
                  await page.reload()
                  await page.wait_for_function("() => !!J.ui && !!J.ui.plan")
                  await page.wait_for_timeout(180)
                  restored=await page.evaluate("""() => ({
                    saved:J.ui.project.ui.previewHeight,
                    h:document.querySelector('#viewport').getBoundingClientRect().height,
                    custom:document.querySelector('#viewport').classList.contains('user-sized')
                  })""")
                  if restored["saved"]!=360 or not restored["custom"] or abs(restored["h"]-360)>4:
                      raise RuntimeError(f"custom preview height did not survive reload: {restored}")

                  if errors:
                      raise RuntimeError("page errors: "+" | ".join(errors))
                  print({
                    "ok":True,
                    "default":default_size,
                    "legacy":legacy,
                    "custom":custom_size,
                    "times":time_dims,
                    "imageRemoved":image_removed,
                    "style":style_state,
                    "hover":hover,
                    "committed":committed,
                    "restored":restored
                  })
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild web app"
          git push
