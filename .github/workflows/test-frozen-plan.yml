name: Test frozen project plan

on:
  push:
    branches:
      - freeze-plan-in-project
    paths:
      - ".github/workflows/test-frozen-plan.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build app
        run: python3 build.py
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test frozen plan persistence
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/jizura-http.log 2>&1 &
          python3 - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width":1440,"height":900})
                  errors=[]
                  page.on("pageerror", lambda e: errors.append(str(e)))
                  await page.goto("http://127.0.0.1:8765/")
                  await page.wait_for_selector("#lineList .ln")

                  # Build a non-trivial project and freeze it.
                  await page.fill("#lyrics", "ALPHA/BETA\nSECOND LINE\nTHIRD LINE!")
                  await page.wait_for_timeout(650)
                  await page.evaluate("""() => {
                    J.ui.project.overrides[0] = Object.assign({}, J.ui.project.overrides[0]||{}, {style:'sakura'});
                    J.ui.project.overrides[1] = Object.assign({}, J.ui.project.overrides[1]||{}, {layout:'huge'});
                    J.ui.project.fx.glitch = .83;
                    J.uiApi.replan();
                    J.ui.plan.cuts[0].__snapshotMarker = 'frozen-v1';
                    J.uiApi.storePlanSnapshot();
                    J.uiApi.flushSave();
                  }""")
                  before = await page.evaluate("""() => ({
                    key:J.ui.project.planSnapshot.inputKey,
                    cuts:JSON.stringify(J.ui.plan.cuts),
                    events:JSON.stringify(J.ui.plan.events),
                    styles:JSON.stringify(J.ui.plan.styles),
                    marker:J.ui.plan.cuts[0].__snapshotMarker
                  })""")
                  payload = await page.evaluate("J.uiApi.projectPayloadForSave()")
                  if not payload.get("planSnapshot") or payload["planSnapshot"].get("version") != 1:
                      raise RuntimeError("saved project has no frozen plan snapshot")

                  # Simulate a future version whose planner is incompatible/different.
                  restored = await page.evaluate("""async payload => {
                    const original = J.plan;
                    let calls = 0;
                    J.plan = () => { calls++; throw new Error('future planner must not run while opening a valid frozen project'); };
                    try {
                      await J.uiApi.applyProjectData(payload);
                      const c = J.ui.plan.cuts[0];
                      const canvas = document.querySelector('#view');
                      J.ui.renderer.frame(canvas.getContext('2d'), J.ui.plan, c.start + Math.min(c.dur*.5,.4), {scale:canvas.width/J.ui.plan.W, fast:true});
                      return {
                        calls,
                        cuts:JSON.stringify(J.ui.plan.cuts),
                        events:JSON.stringify(J.ui.plan.events),
                        styles:JSON.stringify(J.ui.plan.styles),
                        marker:c.__snapshotMarker,
                        activeKey:J.ui.activePlanKey,
                        snapKey:J.ui.project.planSnapshot.inputKey
                      };
                    } finally { J.plan = original; }
                  }""", payload)
                  if restored["calls"] != 0:
                      raise RuntimeError(f"planner ran while restoring valid snapshot: {restored}")
                  if restored["cuts"] != before["cuts"] or restored["events"] != before["events"] or restored["styles"] != before["styles"]:
                      raise RuntimeError("frozen project did not restore the exact generated plan")
                  if restored["marker"] != "frozen-v1" or restored["activeKey"] != restored["snapKey"]:
                      raise RuntimeError(f"snapshot marker/key lost: {restored}")

                  # A deliberately edited project must invalidate the old snapshot and regenerate.
                  edited = json.loads(json.dumps(payload))
                  edited["lyrics"] = "CHANGED LINE\nSECOND LINE\nTHIRD LINE!"
                  regen = await page.evaluate("""async payload => {
                    const original = J.plan;
                    let calls = 0;
                    J.plan = (...args) => { calls++; return original(...args); };
                    try {
                      await J.uiApi.applyProjectData(payload);
                      return {
                        calls,
                        first:J.ui.plan.lines[0] && J.ui.plan.lines[0].text,
                        marker:J.ui.plan.cuts[0] && J.ui.plan.cuts[0].__snapshotMarker,
                        hasSnapshot:!!J.ui.project.planSnapshot,
                        keyMatches:J.ui.activePlanKey === J.ui.project.planSnapshot.inputKey
                      };
                    } finally { J.plan = original; }
                  }""", edited)
                  if regen["calls"] < 1 or regen["first"] != "CHANGED LINE" or regen["marker"] == "frozen-v1" or not regen["keyMatches"]:
                      raise RuntimeError(f"edited project did not invalidate/regenerate snapshot: {regen}")

                  # Return to frozen project, save to local storage, and fully reload.
                  await page.evaluate("payload => J.uiApi.applyProjectData(payload)", payload)
                  await page.evaluate("J.uiApi.flushSave()")
                  await page.reload()
                  await page.wait_for_selector("#lineList .ln")
                  await page.wait_for_function("() => !!J.ui && !!J.ui.plan && !!J.ui.plan.cuts.length")
                  reload_state = await page.evaluate("""() => ({
                    marker:J.ui.plan.cuts[0].__snapshotMarker,
                    keyMatches:J.ui.activePlanKey === J.ui.project.planSnapshot.inputKey
                  })""")
                  if reload_state["marker"] != "frozen-v1" or not reload_state["keyMatches"]:
                      raise RuntimeError(f"local reload did not restore frozen plan: {reload_state}")

                  # Saving during the textarea debounce must freeze the new text, not the stale old plan.
                  await page.fill("#lyrics", "IMMEDIATE SAVE\nSECOND LINE")
                  immediate = await page.evaluate("""async () => {
                    const payload = await J.uiApi.projectPayloadForSave();
                    return {
                      lines:payload.planSnapshot.plan.lines.map(x=>x.text),
                      key:payload.planSnapshot.inputKey,
                      currentKey:J.uiApi.planInputKey(J.ui.project)
                    };
                  }""")
                  if immediate["lines"][:2] != ["IMMEDIATE SAVE","SECOND LINE"] or immediate["key"] != immediate["currentKey"]:
                      raise RuntimeError(f"save-before-debounce froze stale plan: {immediate}")

                  if errors:
                      raise RuntimeError("page errors: " + " | ".join(errors))
                  print({"ok":True,"restoredPlannerCalls":restored["calls"],"regenCalls":regen["calls"],"reload":reload_state,"immediate":immediate})
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild web app"
          git push
