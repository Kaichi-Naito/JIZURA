name: Test timeline line jump fix

on:
  push:
    branches:
      - fix-timeline-line-jump
    paths:
      - "src/**"
      - "app/**"
      - "build.py"
      - ".github/workflows/test-timeline-line-jump.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build app
        run: python3 build.py
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify timeline clicks navigate line list
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/jizura-http.log 2>&1 &
          python3 - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch()
                  page=await b.new_page(viewport={"width":1600,"height":950})
                  errs=[]
                  page.on("pageerror",lambda e: errs.append(str(e)))
                  await page.goto("http://127.0.0.1:8765/")
                  await page.wait_for_selector("#lineList")

                  await page.evaluate("""() => {
                    J.ui.project.lyrics=Array.from({length:31},(_,i)=>'TXT '+String(i).padStart(2,'0')).join(String.fromCharCode(10));
                    J.ui.project.timing.lineTimes=Object.fromEntries(Array.from({length:31},(_,i)=>[i,i*2]));
                    J.ui.project.timing.snap=false;
                    J.uiApi.replan();
                    J.ui.timelineZoom=8;
                    J.ui.timelineStart=0;
                    J.ui.need=true;
                  }""")
                  await page.wait_for_timeout(180)

                  # Put line list at bottom, then click a line-0 timeline cut.
                  await page.locator("#lineList").evaluate("el=>el.scrollTop=el.scrollHeight")
                  before=await page.locator("#lineList").evaluate("el=>el.scrollTop")
                  hit=await page.evaluate("""() => {
                    const h=J.ui.timelineCutHits.find(h=>h.line===0);
                    return h && {x:h.x,y:h.y,w:h.w,h:h.h,line:h.line,cutIndex:h.cutIndex};
                  }""")
                  assert hit, "no timeline hit for line 0"
                  await page.locator("#timeline").scroll_into_view_if_needed()
                  await page.wait_for_timeout(80)
                  tl=await page.locator("#timeline").bounding_box()
                  cs=await page.locator("#timeline").evaluate("el=>({w:el.width,h:el.height})")
                  x=tl["x"]+(hit["x"]+hit["w"]*.5)/cs["w"]*tl["width"]
                  y=tl["y"]+(hit["y"]+hit["h"]*.45)/cs["h"]*tl["height"]
                  target_el=await page.evaluate("""p => {
                    const el=document.elementFromPoint(p.x,p.y);
                    return el && {id:el.id,tag:el.tagName,cls:el.className};
                  }""", {"x":x,"y":y})
                  print({"clickTarget":target_el,"x":x,"y":y,"timelineBox":tl,"canvasSize":cs,"hit":hit})
                  await page.mouse.click(x,y)
                  await page.wait_for_timeout(140)
                  nav=await page.evaluate("""() => {
                    const l=document.querySelector('#lineList'),e=J.ui.lineEls[0];
                    const lr=l.getBoundingClientRect(),er=e.getBoundingClientRect();
                    return {scroll:l.scrollTop,visible:er.top>=lr.top-1&&er.bottom<=lr.bottom+1};
                  }""")
                  assert nav["visible"] and nav["scroll"] < before, (before,nav)

                  # Clicking a timeline dice also replans first, then reveals its line.
                  await page.evaluate("""() => {
                    J.ui.timelineZoom=12; J.ui.timelineStart=0; J.ui.need=true;
                  }""")
                  await page.wait_for_timeout(150)
                  await page.locator("#lineList").evaluate("el=>el.scrollTop=el.scrollHeight")
                  before_action=await page.locator("#lineList").evaluate("el=>el.scrollTop")
                  action=await page.evaluate("""() => {
                    const h=J.ui.timelineActionHits.find(h=>h.action==='dice' && h.line===0);
                    return h && {x:h.x,y:h.y,w:h.w,h:h.h,line:h.line};
                  }""")
                  assert action, "no dice action for line 0"
                  cs=await page.locator("#timeline").evaluate("el=>({w:el.width,h:el.height})")
                  x=tl["x"]+(action["x"]+action["w"]*.5)/cs["w"]*tl["width"]
                  y=tl["y"]+(action["y"]+action["h"]*.5)/cs["h"]*tl["height"]
                  seed0=await page.evaluate("() => ((J.ui.project.overrides[0]||{}).seed||0)")
                  await page.mouse.click(x,y)
                  await page.wait_for_timeout(220)
                  action_nav=await page.evaluate("""() => {
                    const l=document.querySelector('#lineList'),e=J.ui.lineEls[0];
                    const lr=l.getBoundingClientRect(),er=e.getBoundingClientRect();
                    return {
                      scroll:l.scrollTop,
                      visible:er.top>=lr.top-1&&er.bottom<=lr.bottom+1,
                      seed:(J.ui.project.overrides[0]||{}).seed||0
                    };
                  }""")
                  assert action_nav["visible"] and action_nav["scroll"] < before_action, (before_action,action_nav)
                  assert action_nav["seed"]==seed0+1, (seed0,action_nav)

                  if errs: raise RuntimeError("page errors: "+" | ".join(errs))
                  print({"ok":True,"normal":nav,"action":action_nav})
                  await b.close()

          asyncio.run(main())
          PY
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild web app"
          git push
