name: Verify current main workspace and images

on:
  push:
    branches:
      - verify-main-resize-image-nav
    paths:
      - ".github/workflows/verify-main-resize-image-nav.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 build.py
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify in Chromium
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          python3 - <<'PY'
          import asyncio, struct, zlib, binascii
          from playwright.async_api import async_playwright

          def chunk(t,d):
              return struct.pack(">I",len(d))+t+d+struct.pack(">I",binascii.crc32(t+d)&0xffffffff)
          raw=b"\x00\xff\x00\x00\xff"
          png=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",1,1,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b"")
          open("/tmp/red.png","wb").write(png)

          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              page=await b.new_page(viewport={"width":1600,"height":950})
              errs=[]
              page.on("pageerror",lambda e: errs.append(str(e)))
              await page.goto("http://127.0.0.1:8765/")
              await page.wait_for_function("() => !!window.J && !!J.ui && !!J.ui.plan")
              
              # horizontal left-panel resizing
              l0=await page.locator(".col-left").bounding_box()
              sh=await page.locator("#leftSplitter").bounding_box()
              await page.mouse.move(sh["x"]+sh["width"]/2,sh["y"]+120)
              await page.mouse.down()
              await page.mouse.move(sh["x"]+sh["width"]/2+70,sh["y"]+120,steps=5)
              await page.mouse.up()
              await page.wait_for_timeout(100)
              l1=await page.locator(".col-left").bounding_box()
              sw=await page.evaluate("J.ui.project.ui.leftWidth")
              assert l1["width"]>l0["width"]+45,(l0,l1,sw)
              assert abs(l1["width"]-sw)<4,(l1,sw)

              # vertical preview/timeline resizing: drag splitter upward -> dock gets taller
              dock0=await page.locator("#timelineDock").bounding_box()
              hh=await page.locator("#stageSplitter").bounding_box()
              await page.mouse.move(hh["x"]+100,hh["y"]+hh["height"]/2)
              await page.mouse.down()
              await page.mouse.move(hh["x"]+100,hh["y"]+hh["height"]/2-60,steps=5)
              await page.mouse.up()
              await page.wait_for_timeout(120)
              dock1=await page.locator("#timelineDock").bounding_box()
              dh=await page.evaluate("J.ui.project.ui.timelineDockHeight")
              assert dock1["height"]>dock0["height"]+40,(dock0,dock1,dh)
              assert abs(dock1["height"]-dh)<5,(dock1,dh)

              # image element insertion + rendering + project payload
              await page.locator("#imageFile").set_input_files("/tmp/red.png")
              await page.wait_for_timeout(500)
              st=await page.evaluate("""() => {
                const ln=J.ui.plan.lines.find(x=>x.kind==='image');
                const cut=ln&&J.ui.plan.cuts.find(c=>c.line===ln.index&&c.layout==='image');
                const meta=ln&&J.ui.project.images[ln.imageId];
                return {raw:J.ui.project.lyrics,line:ln&&{index:ln.index,imageId:ln.imageId,text:ln.text},cut:cut&&{layout:cut.layout,imageId:cut.imageId,start:cut.start,end:cut.end},meta,cached:!!(ln&&J.getImageAsset(ln.imageId))};
              }""")
              assert "[img:" in st["raw"] and st["line"] and st["cut"] and st["cached"],st
              cv=await page.evaluate("""() => {
                const ln=J.ui.plan.lines.find(x=>x.kind==='image');
                const cut=J.ui.plan.cuts.find(c=>c.line===ln.index&&c.layout==='image');
                const c=document.createElement('canvas'); c.width=320;c.height=180;
                const x=c.getContext('2d'); new J.Renderer().frame(x,J.ui.plan,(cut.start+cut.end)/2,{scale:320/J.ui.plan.W,fast:true});
                const d=x.getImageData(0,0,320,180).data; let red=0;
                for(let i=0;i<d.length;i+=4) if(d[i]>180&&d[i]>d[i+1]*1.5&&d[i]>d[i+2]*1.5) red++;
                return red;
              }""")
              assert cv>100,cv
              payload=await page.evaluate("J.uiApi.projectPayloadForSave()")
              assert payload.get("_imageAssets") and payload["_imageAssets"][0]["dataUrl"].startswith("data:image/"),payload.keys()

              # timeline item click jumps only line-list scroll to target
              await page.evaluate("""() => {
                const img=J.ui.project.lyrics.split(String.fromCharCode(10)).find(x=>x.startsWith('[img:'));
                J.ui.project.lyrics=[img,...Array.from({length:30},(_,i)=>'TXT '+i)].join(String.fromCharCode(10));
                J.ui.project.timing.lineTimes=Object.fromEntries(Array.from({length:31},(_,i)=>[i,i*2]));
                J.uiApi.replan();
                J.ui.timelineZoom=1; J.ui.timelineStart=0; J.ui.need=true;
              }""")
              await page.wait_for_timeout(180)
              await page.locator("#lineList").evaluate("el=>el.scrollTop=el.scrollHeight")
              before=await page.locator("#lineList").evaluate("el=>el.scrollTop")
              hit=await page.evaluate("""() => {
                const h=J.ui.timelineCutHits.find(h => {
                  const c=J.ui.plan.cuts[h.cutIndex]; return c && c.line===0;
                });
                return h && {x:h.x,y:h.y,w:h.w,h:h.h};
              }""")
              assert hit, "no timeline hit for line 0"
              tl=await page.locator("#timeline").bounding_box()
              cs=await page.locator("#timeline").evaluate("el=>({w:el.width,h:el.height})")
              x=tl["x"]+(hit["x"]+hit["w"]*.5)/cs["w"]*tl["width"]
              y=tl["y"]+(hit["y"]+hit["h"]*.45)/cs["h"]*tl["height"]
              await page.mouse.click(x,y)
              await page.wait_for_timeout(120)
              nav=await page.evaluate("""() => {const l=document.querySelector('#lineList'),e=J.ui.lineEls[0],lr=l.getBoundingClientRect(),er=e.getBoundingClientRect(); return {scroll:l.scrollTop,visible:er.top>=lr.top-1&&er.bottom<=lr.bottom+1};}""")
              assert nav["visible"] and nav["scroll"]<before, (before,nav)

              # local reload restores sizes + image
              await page.evaluate("J.uiApi.flushSave()")
              await page.reload()
              await page.wait_for_function("() => !!J.ui && !!J.ui.plan")
              await page.wait_for_timeout(250)
              re=await page.evaluate("""() => {const ln=J.ui.plan.lines.find(x=>x.kind==='image');return {left:document.querySelector('.col-left').getBoundingClientRect().width,dock:document.querySelector('#timelineDock').getBoundingClientRect().height,sl:J.ui.project.ui.leftWidth,sd:J.ui.project.ui.timelineDockHeight,img:!!ln,cached:!!(ln&&J.getImageAsset(ln.imageId))};}""")
              assert abs(re["left"]-re["sl"])<5 and abs(re["dock"]-re["sd"])<5 and re["img"] and re["cached"],re
              if errs: raise RuntimeError("page errors: "+" | ".join(errs))
              print({"ok":True,"left":[l0["width"],l1["width"]],"dock":[dock0["height"],dock1["height"]],"image":st,"red":cv,"nav":nav,"restored":re})
              await b.close()
          asyncio.run(main())
          PY
